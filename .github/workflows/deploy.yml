# src: https://github.com/rust-lang/mdBook/wiki/Automated-Deployment%3A-GitHub-Actions
name: Deploy
on:
  push:
    branches:
      - master
  schedule:
    - cron: '0 0 * * 0' # weekly on Sunday at midnight UTC to refresh cached OG images

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install latest mdbook
        env:
          # Unauthenticated API calls share a 60/hour limit per runner IP and often get refused.
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(curl -sS --fail -H "Authorization: Bearer ${GH_TOKEN}" 'https://api.github.com/repos/rust-lang/mdbook/releases/latest' | jq -er '.tag_name')
          url="https://github.com/rust-lang/mdbook/releases/download/${tag}/mdbook-${tag}-x86_64-unknown-linux-gnu.tar.gz"
          mkdir mdbook
          curl -sSL --fail "$url" | tar -xz --directory=./mdbook
          echo `pwd`/mdbook >> $GITHUB_PATH
      - name: Refresh OpenGraph images
        run: |
          mkdir -p src/og-cache
          repos="dais-polymtl/flock AlexsJones/llmfit yorukot/superfile esnet/iperf Chatterino/chatterino2"
          # The hash segment is a cache-buster; change it weekly so GitHub's CDN serves a fresh card.
          hash=$(date -u +%G%V)
          # Fetch URL $1 into file $2; succeed only if it is a non-empty PNG.
          fetch_png() { curl -sSL --fail -o "$2" "$1" && head -c 8 "$2" | grep -q PNG; }
          for repo in $repos; do
            name="${repo##*/}"
            out="src/og-cache/${name}.png"
            fresh=false
            for attempt in 1 2 3 4 5; do
              if fetch_png "https://opengraph.githubassets.com/${hash}/${repo}" "$out"; then
                fresh=true
                break
              fi
              sleep $((attempt * 10))
            done
            if [ "$fresh" = true ]; then
              continue
            fi
            # GitHub Actions caches expire after 7 days unused, so fall back to the copy
            # that is currently deployed on the live site instead.
            if fetch_png "https://izarrios.github.io/og-cache/${name}.png" "$out"; then
              echo "::warning::Failed to fetch fresh OG image for ${repo}, reusing the currently deployed one"
            else
              rm -f "$out"
              echo "::error::Failed to fetch OG image for ${repo} and no deployed copy exists; the card will be missing"
            fi
          done
      - name: Build Book
        run: |
          # This assumes your book is in the root of your repository.
          # Just add a `cd` here if you need to change to another directory.
          mdbook build
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: 'book'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
